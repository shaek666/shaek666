name: Living Banner

on:
  schedule:
    # Daily at midnight UTC; hue follows the day of the week
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyfiglet pillow

      - name: Render banner with day-of-week hue
        run: |
          python - <<'EOF'
          import datetime
          import colorsys
          import pyfiglet
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          # Monday violet (270) drifts +12 deg each day -> Sunday pink (342)
          hue = (270 + datetime.date.today().weekday() * 12) % 360
          r, g, b = colorsys.hsv_to_rgb(hue / 360, 0.75, 1.0)
          glow = "#%02x%02x%02x" % (int(r * 255), int(g * 255), int(b * 255))
          print("hue:", hue, "glow:", glow)

          FONT = "/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf"
          art = pyfiglet.figlet_format("Shaek", font="isometric1").rstrip("\n")
          size = 30
          font = ImageFont.truetype(FONT, size)
          pad = 60

          tmp = Image.new("RGBA", (10, 10))
          d = ImageDraw.Draw(tmp)
          bbox = d.multiline_textbbox((0, 0), art, font=font)
          w, h = bbox[2] + pad * 2, bbox[3] + pad * 2

          halo = Image.new("RGBA", (w, h), (0, 0, 0, 0))
          hd = ImageDraw.Draw(halo)
          hd.multiline_text((pad, pad), art, font=font, fill=glow)
          halo = halo.filter(ImageFilter.GaussianBlur(radius=9))

          img = Image.new("RGBA", (w, h), (0, 0, 0, 0))
          img.alpha_composite(halo)
          d = ImageDraw.Draw(img)
          d.multiline_text((pad, pad), art, font=font, fill="#F3E8FF")
          img.save("assets/shaek-living.png")
          print("rendered assets/shaek-living.png", img.size)
          EOF

      - name: Commit only when the tint changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/shaek-living.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: living banner hue rotation [skip ci]" && git push)
